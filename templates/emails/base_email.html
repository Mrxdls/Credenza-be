<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Credenza Portal Notification{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #f8fafc;
      padding: 40px 16px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 32px 36px;
      text-align: left;
    }
    .header-logo {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .header-tagline {
      font-size: 13px;
      color: #94a3b8;
      margin: 4px 0 0 0;
    }
    .content {
      padding: 36px;
      font-size: 15px;
      line-height: 1.6;
      color: #334155;
    }
    .content h1, .content h2 {
      color: #0f172a;
      font-weight: 700;
      margin-top: 0;
    }
    .card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      margin: 24px 0;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .card-row:last-child {
      border-bottom: none;
    }
    .card-label {
      color: #64748b;
      font-weight: 500;
    }
    .card-value {
      color: #0f172a;
      font-weight: 600;
      text-align: right;
    }
    .btn-container {
      margin: 28px 0;
      text-align: center;
    }
    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 8px;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 9999px;
      background-color: #dbeafe;
      color: #1e40af;
    }
    .badge-pending {
      background-color: #fef3c7;
      color: #92400e;
    }
    .badge-success {
      background-color: #dcfce7;
      color: #166534;
    }
    .footer {
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 24px 36px;
      text-align: center;
      font-size: 13px;
      color: #64748b;
    }
    .footer a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1 class="header-logo">CREDENZA</h1>
        <p class="header-tagline">Institutional Excellence & Audit Portal</p>
      </div>

      <div class="content">
        {% block content %}{% endblock %}
      </div>

      <div class="footer">
        <p style="margin: 0 0 6px 0;">This is an automated system notification from Credenza.</p>
        <p style="margin: 0;">For inquiries, contact us at <a href="mailto:info@oryvo.co.in">info@oryvo.co.in</a></p>
        <p style="margin: 12px 0 0 0; font-size: 12px; color: #94a3b8;">&copy; {% now "Y" %} Oryvo. All rights reserved.</p>
      </div>
    </div>
  </div>
</body>
</html>
